name: KuchniaHACCP Monitor

on:
  schedule:
    - cron: "0 6,18 * * *"   # 06:00 i 18:00 UTC (08:00 i 20:00 PL)
  workflow_dispatch:           # możliwość ręcznego uruchomienia

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --ci

      - name: Commit dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html leads.json
          git diff --cached --quiet || git commit -m "chore: update dashboard [skip ci]"
          git push
